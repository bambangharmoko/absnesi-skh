<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#059669;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0d9488;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="grad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#10b981;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#3b82f6;stop-opacity:1" />
    </linearGradient>
  </defs>
  <!-- Background Rounded Squircle -->
  <rect width="512" height="512" rx="128" fill="url(#grad1)" />
  
  <!-- Outer Focus Ring -->
  <circle cx="256" cy="256" r="180" fill="none" stroke="#ffffff" stroke-width="12" stroke-dasharray="30 20" opacity="0.4" />
  
  <!-- Camera / Face Frame -->
  <rect x="140" y="140" width="232" height="232" rx="32" fill="#0f172a" opacity="0.85" />
  
  <!-- Face AI Head Outline -->
  <ellipse cx="256" cy="235" rx="55" ry="65" fill="#f8fafc" />
  <!-- Hair / Cap -->
  <path d="M 200 215 Q 256 160 312 215 Z" fill="#334155" />
  <!-- Eyes -->
  <circle cx="236" cy="230" r="7" fill="#0f172a" />
  <circle cx="276" cy="230" r="7" fill="#0f172a" />
  <!-- Smile -->
  <path d="M 238 265 Q 256 280 274 265" fill="none" stroke="#059669" stroke-width="5" stroke-linecap="round" />
  
  <!-- Verified Badge -->
  <circle cx="340" cy="340" r="42" fill="#10b981" stroke="#ffffff" stroke-width="6" />
  <path d="M 324 340 L 336 352 L 358 330" fill="none" stroke="#ffffff" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" />
  
  <!-- Scanner Beam Line -->
  <line x1="120" y1="256" x2="392" y2="256" stroke="#34d399" stroke-width="6" stroke-linecap="round" opacity="0.8" />
</svg>